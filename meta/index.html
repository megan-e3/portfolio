<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megan Yu: Meta</title>
    <link rel='stylesheet' href='../style.css'>
    <script type="module" src="../global.js" ></script>
    <script src="./main.js" type="module"></script>
</head>
<body>    
    <h1>
        Meta
    </h1>

    This page includes stats about the code of this website.
    
    <h2>Summary</h2>

    <div class="commit-slider">
        <label>
            Show commits until:
            <input type="range" id="commit-progress" min="0" max="100" value="100">
            <time id="commit-time-display"></time>
        </label>
    </div>    
    
    <div id="stats"></div>

    <div id="scrolly-1">
        <div id="scatter-story" class="story"></div>
        <div id="scatter-plot" class="visualization">
            <h2>Commits by time of day</h2>
            <div id="chart"></div>
            <p id="selection-count">No commits selected</p>
            <dl id="language-breakdown" class="stats"></dl>
        </div>
    </div>

    <div id="scrolly-2">
        <div id="files" class="visualization"></div>
        <div id="unit-story" class="story"></div>
    </div>

    <dl id="commit-tooltip" class="info tooltip" hidden>
    <dt>Commit</dt>
    <dd>
        <a href="" id="commit-link" target="_blank"></a>
    </dd>

    <dt>Date</dt>
    <dd id="commit-date"></dd>

    <!-- Add: Time, author, lines edited -->
    <dt>Time</dt>
    <dd id="commit-time"></dd>

    <dt>Author</dt>
    <dd id="commit-author"></dd>

    <dt>Lines edited</dt>
    <dd id="commit-lines"></dd>
    </dl>

    <dl id="files">
        <!-- we want the following structure for each file:
        <div>
            <dt>
            <code>{file.name}</code>
            </dt>
            <dd>{file.lines.length} lines</dd>
        </div>
        -->
    </dl>
</body>
</html>
